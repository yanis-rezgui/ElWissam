name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------
  # FRONTEND (React + TypeScript + Vite)
  # ---------------------------------------------------------
  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  frontend-build:
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # tsc (via vite build) fait office de vérification de types :
      # une erreur TS casse le job avant que Vercel n'y touche
      - name: Build (type-check + bundle)
        run: npm run build

  # ---------------------------------------------------------
  # BACKEND (Express + Prisma)
  # ---------------------------------------------------------
  # Pas de job "backend-lint" pour l'instant : le package.json backend
  # n'a pas encore de script "lint" (seulement dev/start).
  # Ajouter dans backend/package.json :
  #   "lint": "eslint ."
  # puis décommenter le job ci-dessous.
  #
  # backend-lint:
  #   runs-on: ubuntu-latest
  #   defaults:
  #     run:
  #       working-directory: backend
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: '22.x'
  #         cache: 'npm'
  #         cache-dependency-path: backend/package-lock.json
  #     - run: npm ci
  #     - run: npm run lint

  backend-prisma-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Valide le schema.prisma et vérifie que le client se génère
      # sans erreur — attrape les migrations cassées avant Render
      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      # Pas de "npm test" pour l'instant : aucun script "test" dans
      # backend/package.json. Ajouter un framework de test (ex: node
      # --test, vitest) puis décommenter :
      # - name: Run tests
      #   run: npm test